<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — موجز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div style="background:#fff7e0;color:#6b4e00;text-align:center;padding:8px 12px;font-size:14px;border-bottom:1px solid #f0dca0">نموذج تجريبي (prototype): الحسابات والاجتماعات تُحفظ في قاعدة بيانات، والتلخيص الآلي (Gemini) شغّال فقط للملاحظات اللي تكتبها في صفحة حسابك. الملخصات والأرقام في باقي الصفحات عينات.</div>
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><span class="dot">م</span> موجز</a>
    <nav class="nav">
      <span id="navRole"></span>
      <button class="btn ghost small" id="logoutBtn">تسجيل الخروج</button>
    </nav>
  </div>
</header>

<section class="dash-header">
  <div class="container">
    <div>
      <h1 id="welcomeTitle">أهلاً</h1>
      <p style="color:var(--muted)" id="welcomeSub"></p>
    </div>
    <div class="who">
      <div class="avatar" id="avatarLetter">أ</div>
      <div>
        <div style="font-weight:800" id="userName"></div>
        <span class="role-badge" id="userRoleBadge"></span>
      </div>
    </div>
  </div>
</section>

<main class="container">
  <div class="dash-stats" id="dashStats"></div>

  <div class="dash-grid">
    <div class="panel">
      <h2 id="meetingsTitle">الاجتماعات والملخصات</h2>
      <div id="meetingsList"></div>
    </div>
    <div class="panel">
      <h2 id="teamTitle">الفريق</h2>
      <div id="teamList"></div>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
