<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب — موجز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><span class="dot">م</span> موجز</a>
    <nav class="nav">
      <a href="login.html">تسجيل الدخول</a>
    </nav>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>إنشاء حساب جديد</h1>
    <p class="hint">سجّل بياناتك واختار دورك في الفريق.</p>

    <div class="form-error" id="formError"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">الاسم الكامل</label>
        <input type="text" id="name" placeholder="مثال: أحمد سامح" required>
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="٦ حروف على الأقل" required>
      </div>
      <div class="field">
        <label>الدور</label>
        <div class="role-picker">
          <label class="role-option"><input type="radio" name="role" value="user" checked><span>مستخدم</span></label>
          <label class="role-option"><input type="radio" name="role" value="leader"><span>قائد فريق</span></label>
          <label class="role-option"><input type="radio" name="role" value="manager"><span>مدير</span></label>
        </div>
      </div>
      <button class="btn" type="submit" style="width:100%">إنشاء الحساب</button>
    </form>

    <p class="auth-switch">عندك حساب؟ <a href="login.html">سجّل دخولك</a></p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
