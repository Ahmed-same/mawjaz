<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — موجز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><span class="dot">م</span> موجز</a>
    <nav class="nav">
      <a class="btn ghost small" href="register.html">إنشاء حساب</a>
    </nav>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>أهلاً بيك تاني</h1>
    <p class="hint">سجّل دخولك عشان تشوف ملخصاتك.</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="كلمة المرور" required>
      </div>
      <button class="btn" type="submit" style="width:100%">تسجيل الدخول</button>
    </form>

    <div class="demo-logins">
      <p>أو جرّب بحساب تجريبي:</p>
      <div class="row">
        <button class="btn ghost small" data-demo="user">مستخدم</button>
        <button class="btn ghost small" data-demo="leader">قائد فريق</button>
        <button class="btn ghost small" data-demo="manager">مدير</button>
      </div>
    </div>

    <p class="auth-switch">ليس لديك حساب؟ <a href="register.html">أنشئ حساباً</a></p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
